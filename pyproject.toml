[project]
name = "steam-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "python-logstash>=0.4.8",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    "**/__pycache__/*",
]

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "ANN"]
