input {
  tcp {
    port => 5000
    codec => "json_lines"
    type => "django-tcp"
  }

  beats {
    port => 5044
    codec => "json"
  }
}

filter {
  mutate {
    remove_field => ["host", "ecs", "agent", "log", "input"]
  }

  if [type] == "django-tcp" {
    mutate {
      add_field => { "source" => "tcp" }
      add_tag => ["source-tcp"]
    }
  }

  if [source] == "django-filebeat" {
    mutate {
      add_field => { "source" => "filebeat" }
      add_tag => ["source-filebeat"]
    }
  }

  # Парсим логи Django
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:timestamp} - %{LOGLEVEL:level} - %{DATA:module} - %{GREEDYDATA:message_text}"
      ]
    }
  }

  if "_grokparsefailure" in [tags] {
    mutate {
      remove_tag => ["_grokparsefailure"]
    }
  }

  # Добавляем общие поля
  mutate {
    add_field => {
      "environment" => "production"
      "application" => "steam-tracker"
    }
  }

  # Парсим логи сохранения игры
  if [message] =~ "🎮 Сохранена игра" {
    grok {
      match => {
        "message" => "🎮 Сохранена игра: %{DATA:game_name} \\(ID: %{NUMBER:appid}\\) - CCU: %{NUMBER:ccu}, Владельцев: %{DATA:owners}"
      }
    }
    mutate {
      convert => { "ccu" => "integer" }
      convert => { "appid" => "integer" }
      add_tag => ["steam_parse"]
    }
  }

  # Парсим топ-5
  if [message] =~ "🏆 Топ-" {
    grok {
      match => {
        "message" => "🏆 Топ-%{NUMBER:top_rank}: %{DATA:game_name} - %{NUMBER:ccu} игроков \\(CCU\\)"
      }
    }
    mutate {
      convert => { "top_rank" => "integer" }
      convert => { "ccu" => "integer" }
      add_tag => ["steam_top"]
    }
  }

  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "django-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
