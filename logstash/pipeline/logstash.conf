input {
  # Прием логов из Django через TCP
  tcp {
    port => 5000
    codec => "json_lines"
    type => "django"
  }
}

filter {
  # Для логов Django
  if [type] == "django" {
    mutate {
      add_field => { "source" => "django" }
    }

    # Парсим логи Django
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:timestamp} - %{LOGLEVEL:level} - %{DATA:module} - %{GREEDYDATA:message_text}"
        ]
      }
    }

    # Если не распарсилось - оставляем как есть
    if "_grokparsefailure" in [tags] {
      mutate {
        remove_tag => ["_grokparsefailure"]
      }
    }

    # Добавляем информацию о среде
    mutate {
      add_field => {
        "environment" => "production"
        "application" => "steam-tracker"
      }
    }

    # Парсим логи сохранения игры
    if [message] =~ "🎮 Сохранена игра" {
      grok {
        match => {
          "message" => "🎮 Сохранена игра: %{DATA:game_name} \\(ID: %{NUMBER:appid}\\) - CCU: %{NUMBER:ccu}, Владельцев: %{DATA:owners}"
        }
      }
      mutate {
        convert => { "ccu" => "integer" }
        convert => { "appid" => "integer" }
        add_tag => ["steam_parse"]
      }
    }

    # Парсим топ-5
    if [message] =~ "🏆 Топ-" {
      grok {
        match => {
          "message" => "🏆 Топ-%{NUMBER:top_rank}: %{DATA:game_name} - %{NUMBER:ccu} игроков \\(CCU\\)"
        }
      }
      mutate {
        convert => { "top_rank" => "integer" }
        convert => { "ccu" => "integer" }
        add_tag => ["steam_top"]
      }
    }
  }

  # Добавляем временную метку если нет
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  # Отправка в Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "django-logs-%{+YYYY.MM.dd}"
  }

  # Вывод в консоль для отладки (полезно для проверки)
  stdout {
    codec => rubydebug
  }
}
